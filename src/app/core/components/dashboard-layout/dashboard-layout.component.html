<!-- dashboard-layout.component.html -->
<div class="min-h-screen flex">

    <!-- Sidebar -->
    <app-sidebar *ngIf="isSidebarOpen" class="w-64 bg-white border-r"></app-sidebar>
  
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
      
        <!-- Top Navbar -->
        <header class="h-16 bg-gray-50 shadow flex items-center justify-between px-6">
            <button (click)="toggleSidebar()" class="text-2xl text-gray-700 focus:outline-none">
                ☰
            </button>
            <div class="text-lg font-semibold">Dashboard</div>
        </header>
  
      <!-- Page Content -->
      <main class="flex-1 p-6 bg-gray-100">
        <router-outlet></router-outlet>
      </main>
  
    </div>
  
  </div>
