<div class="task-board">
    <h1 class="task-board-title">🗂️ Task Board</h1>
  
    <div class="task-board-actions">
        <button 
          (click)="openModal()" 
          class="task-board-add-button">
          ➕ Add Task
        </button>
    </div>

    <div class="task-columns">
        <div 
          class="task-column" 
          *ngFor="let status of ['TODO', 'IN_PROGRESS', 'DONE']">
          
          <h2 class="task-column-title">
            {{ status.replace('_', ' ') }}
          </h2>
      
          <div class="task-list">
            <div *ngFor="let task of getTasksByStatus(status)" class="task-card">
              <h3 class="task-card-title">{{ task.title }}</h3>
              <p class="task-card-description" *ngIf="task.description">{{ task.description }}</p>
              <p class="task-card-created">Created: {{ task.createdAt }}</p>
            </div>
          </div>
      
        </div>
      </div>
</div>
<!-- Task Modal -->
<div 
  *ngIf="showModal" 
  class="task-modal"
>
  <div class="task-modal-content">
    <h2 class="task-modal-title">➕ Add New Task</h2>

    <form (ngSubmit)="addTask()" #taskForm="ngForm" novalidate class="task-form">
      <input 
        type="text" 
        [(ngModel)]="newTask.title" 
        name="title" 
        placeholder="Task Title" 
        required
        class="task-form-input"
      />
      <textarea 
        [(ngModel)]="newTask.description" 
        name="description" 
        placeholder="Description" 
        rows="3"
        class="task-form-textarea"
      ></textarea>
      <select 
        [(ngModel)]="newTask.status" 
        name="status" 
        required 
        class="task-form-select"
      >
        <option value="" disabled selected>Select Status</option>
        <option value="TODO">To Do</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="DONE">Done</option>
      </select>

      <div class="task-form-actions">
        <button 
          type="button" 
          class="task-form-cancel-button"
          (click)="closeModal()"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="task-form-submit-button"
        >
          Create
        </button>
      </div>
    </form>
  </div>
</div>
